# Spike S-D (ADR 0021; nfx ADR 0103 §3 step 1): the thin Rust iroh helper on linux-x64, both
# directions against nfxd over iroh-blobs (NFX-06), through S5′'s NAT matrix, with its size and
# memory measured. Record: docs/spikes/S-D-iroh-helper.md. Nothing in the app runs the helper.
#
# Supply-chain policy as ci.yml (threat T12): first-party actions pinned by commit SHA, every
# download checked against a pinned sha256, Cargo.lock honoured (--locked), least-privilege
# token. nfx is checked out read-only at a pinned commit and only built here; so is strfry, the
# stock Nostr relay of the matrix's stock-relay cells (nfx #30's groundwork: "compatible with
# Nostr relays", proven rather than asserted), at its release tag's commit with the submodule
# commits that tree records.
#
# The checks (helper fmt/clippy/tests, cargo deny, the Bare smoke run under bare-sidecar, the
# NAT matrix) each record an outcome and do not stop the others; the `verdict` job fails the run
# if any judged one failed. Runs on pull requests that touch the spike, and by hand; never on a
# push to main.
name: spike-iroh

on:
  pull_request:
    paths:
      - 'crates/iroh-helper/**'
      - 'spikes/iroh/**'
      - 'packages/app-desktop/src/worker/iroh/**'
      - '.github/workflows/spike-iroh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-iroh-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.98.0'
  CARGO_DENY_VERSION: '0.20.2'
  CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
  # The nfx commit whose nfxd the helper is judged against: nfx main with #18 (`nfxd
  # --iroh-relay-ca`), so nfxd can use the matrix's TLS relay and every TLS cell is judged in all
  # four pairings. The matrix's port-forwarded seeder cells (fwdseed-*) need nfx N1's
  # `--iroh-bind`/`--iroh-external` and skip until this pin is bumped to a commit that has them
  # (run.sh reads nfxd's usage text, never this pin).
  NFX_SHA: '5d628db55ad0eb203ab01b4cbf8280b0d1a8c587'
  IROH_RELAY_VERSION: '1.2.0'
  # strfry 1.1.3 (released 2026-09-04): the commit its tag names. Built with its own Makefile;
  # run with its own default strfry.conf, only the database, address and port changed.
  STRFRY_VERSION: '1.1.3'
  STRFRY_SHA: '16c00df04e264f4d68db5e10a48127f015c7824b'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  NODE_OPTIONS: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      test: ${{ steps.test.outcome }}
      deny: ${{ steps.deny.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SovereignTechnology/nfx
          ref: ${{ env.NFX_SHA }}
          path: nfx
          persist-credentials: false
      - name: toolchain and cargo-deny (each download checked against its pinned sha256)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          curl -sSfLo /tmp/deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  /tmp/deny.tgz" | sha256sum -c -
          tar -xzf /tmp/deny.tgz -C /tmp
          sudo install -m 0755 "/tmp/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          mkdir -p bins results
      - name: cache (cargo registry, nfx and iroh-relay builds)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/iroh-helper/target
            nfx/crates/target
            ${{ runner.temp }}/iroh-relay
          key: spike-iroh-${{ env.RUST_VERSION }}-${{ env.NFX_SHA }}-relay-${{ env.IROH_RELAY_VERSION }}-${{ hashFiles('crates/iroh-helper/Cargo.lock') }}
          restore-keys: |
            spike-iroh-${{ env.RUST_VERSION }}-${{ env.NFX_SHA }}-relay-${{ env.IROH_RELAY_VERSION }}-
      - name: helper — fmt
        id: fmt
        continue-on-error: true
        working-directory: crates/iroh-helper
        run: cargo fmt --check
      - name: helper — clippy
        id: clippy
        continue-on-error: true
        working-directory: crates/iroh-helper
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: helper — unit tests
        id: test
        continue-on-error: true
        working-directory: crates/iroh-helper
        run: cargo test --locked
      - name: helper — cargo deny (RustSec, licences, sources)
        id: deny
        continue-on-error: true
        working-directory: crates/iroh-helper
        run: |
          set -o pipefail
          cargo deny check 2>&1 | tee ../../results/deny.txt
      - name: helper — release builds and their sizes
        working-directory: crates/iroh-helper
        run: |
          set -euo pipefail
          cargo build --release --locked
          cargo build --profile release-small --locked
          install -m 0755 target/release/nutflix-iroh-helper ../../bins/
          release=$(stat -c %s target/release/nutflix-iroh-helper)
          small=$(stat -c %s target/release-small/nutflix-iroh-helper)
          gz=$(gzip -9c target/release/nutflix-iroh-helper | wc -c)
          crates=$(grep -c '^name = ' Cargo.lock)
          printf '{"release_bytes":%s,"release_small_bytes":%s,"release_gzip_bytes":%s,"lock_crates":%s}\n' \
            "$release" "$small" "$gz" "$crates" | tee ../../results/size.json
          file target/release/nutflix-iroh-helper | tee -a ../../results/size.txt
          ldd target/release/nutflix-iroh-helper | tee -a ../../results/size.txt || true
      - name: nfxd and nfx-package (nfx at the pinned commit)
        working-directory: nfx/crates
        run: |
          set -euo pipefail
          cargo "+$RUST_VERSION" build --release --locked -p nfxd -p nfx-media --bins
          install -m 0755 target/release/nfxd target/release/nfx-package ../../bins/
          stat -c '%n %s' target/release/nfxd | tee -a ../../results/size.txt
      - name: iroh-relay (the stock binary, from its published Cargo.lock)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/iroh-relay"
          [ -x "$root/bin/iroh-relay" ] || cargo "+$RUST_VERSION" install "iroh-relay@${IROH_RELAY_VERSION}" --locked --features server --root "$root"
          install -m 0755 "$root/bin/iroh-relay" bins/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hoytech/strfry
          ref: ${{ env.STRFRY_SHA }}
          path: strfry
          submodules: recursive
          persist-credentials: false
      - name: strfry cache (keyed by its commit)
        id: strfry-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/strfry-bin
          key: spike-iroh-strfry-${{ env.STRFRY_SHA }}-ubuntu-24.04
      - name: strfry (the stock relay, built from its pinned commit with its own Makefile)
        run: |
          set -euo pipefail
          [ "$(git -C strfry rev-parse HEAD)" = "$STRFRY_SHA" ]
          bin="$RUNNER_TEMP/strfry-bin"
          if [ ! -x "$bin/strfry" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends g++ make pkg-config libtool \
              libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev
            make -C strfry setup-golpe
            make -C strfry -j"$(nproc)"
            mkdir -p "$bin"
            strip -o "$bin/strfry" strfry/strfry
          fi
          install -m 0755 "$bin/strfry" bins/
          install -m 0644 strfry/strfry.conf bins/strfry.conf
          stat -c '%n %s' bins/strfry | tee -a results/size.txt
          ldd bins/strfry | tee -a results/size.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-iroh-bins
          path: bins/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-iroh-build-results
          path: results/
          retention-days: 30

  matrix:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      bare: ${{ steps.bare.outcome }}
      nat: ${{ steps.nat.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: system packages (ffmpeg for nfx-package, nftables for the routers, strfry's libraries)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg liblmdb-dev libsecp256k1-dev libzstd-dev
          command -v nft >/dev/null || sudo apt-get install -y -qq nftables
      - run: npm ci --ignore-scripts
      # The harness imports the built packages (core, seeder) and the worker's helper client.
      - run: npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spike-iroh-bins
          path: bins
      - name: binaries (artifacts drop the executable bit)
        run: |
          set -euo pipefail
          chmod 0755 bins/nfxd bins/nfx-package bins/iroh-relay bins/nutflix-iroh-helper bins/strfry
          ls -l bins && mkdir -p results
          # strfry's shared libraries all resolve here, or the stock-relay cells cannot start.
          if ldd bins/strfry | grep -F 'not found'; then echo "::error::strfry: a library is missing"; exit 1; fi
      - name: the helper under the real Bare runtime (bare-sidecar, bare-subprocess, stdin pipe)
        id: bare
        continue-on-error: true
        run: |
          set -euo pipefail
          dir=node_modules/.cache/spike-iroh-bare
          mkdir -p "$dir"
          cp spikes/iroh/bare-boot.mjs "$dir/boot.mjs"
          node_modules/.bin/esbuild spikes/iroh/bare-smoke.mjs --bundle --packages=external \
            --format=esm --platform=neutral --target=es2022 --outfile="$dir/smoke.mjs" --log-level=warning
          work=$(mktemp -d)
          head -c 307200 /dev/urandom > "$work/file.bin"
          sha=$(sha256sum "$work/file.bin" | cut -d' ' -f1)
          # Started by bare-sidecar, as the host starts the worker, so Bare holds `Bare.IPC` (fd 3).
          # The plain `bare` without that pipe tears itself down while it holds a subprocess: spike
          # S-D's finding 10, which slice 5e-1 showed is Bare's own (it happens with `cat`) and never
          # reaches the worker (run 41189554679). ci.yml keeps that regression check
          # (bare-subprocess.test.ts); this one drives the real helper. One run, with a
          # process-state sample after 10 s.
          set +e
          NUTFLIX_IROH_HELPER_TRACE=1 timeout -k 5 40 node spikes/iroh/bare-sidecar-run.mjs "$dir/boot.mjs" \
            "$PWD/bins/nutflix-iroh-helper" "$work/run" "$work/file.bin" "$sha" \
            "$PWD/results/bare.json" > results/bare.out 2> results/bare.err &
          pid=$!
          sleep 10
          ps -eo pid,ppid,pgid,stat,wchan:32,pcpu,etimes,args | grep -E '[p]rebuilds/linux-x64/bare|[n]utflix-iroh-helper' > results/bare.ps
          for p in $(pgrep -f '[n]utflix-iroh-helper|[p]rebuilds/linux-x64/bare'); do
            echo "== $p"; grep -E '^(State|Threads|SigPnd|ShdPnd|SigBlk|SigIgn)' "/proc/$p/status"
          done >> results/bare.ps 2>/dev/null
          wait "$pid"
          status=$?
          set -e
          for f in bare.json bare.json.progress bare.ps bare.err; do
            echo "--- $f"; head -c 4000 "results/$f" 2>/dev/null || echo "(none)"
          done
          # A pass is an exit 0 AND a result file saying ok: Bare also exits 0 when it tears down
          # mid-run (S-D's runs 7 and 8 counted that as a pass; it is not one).
          ok=$(python3 -c 'import json,sys; print("yes" if json.load(open(sys.argv[1])).get("ok") is True else "no")' results/bare.json 2>/dev/null || echo no)
          echo "sidecar=$status/$ok" | tee results/bare-outcomes.txt
          [ "$status" -eq 0 ] && [ "$ok" = yes ]
      - name: NAT matrix (root, network namespaces)
        id: nat
        continue-on-error: true
        run: |
          sudo env "PATH=$PATH" OUT="$PWD/results" WORK="$RUNNER_TEMP/spike-iroh" \
            HELPER="$PWD/bins/nutflix-iroh-helper" NFXD="$PWD/bins/nfxd" \
            NFX_PACKAGE="$PWD/bins/nfx-package" IROH_RELAY="$PWD/bins/iroh-relay" \
            STRFRY="$PWD/bins/strfry" STRFRY_CONF="$PWD/bins/strfry.conf" \
            ./spikes/iroh/nat/run.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: spike-iroh-build-results
          path: results/build
      - name: summary
        if: always()
        env:
          BARE: ${{ steps.bare.outcome }}
          NAT: ${{ steps.nat.outcome }}
          FMT: ${{ needs.build.outputs.fmt }}
          CLIPPY: ${{ needs.build.outputs.clippy }}
          TEST: ${{ needs.build.outputs.test }}
          DENY: ${{ needs.build.outputs.deny }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" results
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          e = os.environ
          print("## Spike S-D: the iroh helper")
          print(f"fmt {e['FMT']} · clippy {e['CLIPPY']} · tests {e['TEST']} · cargo deny {e['DENY']} · Bare {e['BARE']} · NAT matrix {e['NAT']}")
          try:
              print(f"\nBare run (exit/ok): `{open('results/bare-outcomes.txt').read().strip()}`")
          except FileNotFoundError:
              pass
          try:
              s = json.load(open("results/build/size.json"))
              print(f"\nhelper: release {s['release_bytes']:,} B · release-small {s['release_small_bytes']:,} B · gzip -9 {s['release_gzip_bytes']:,} B · {s['lock_crates']} crates in the lock")
          except Exception as x:
              print(f"\nsizes: unavailable ({x})")
          # relayed B is the iroh relay's traffic only; nostr B is the Nostr relay's (:7447).
          print("\n| check | expect | passed | path | direct B | relayed B | nostr B | Mbit/s | wall ms | detail |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          try:
              for line in open("results/nat.jsonl"):
                  d = json.loads(line)
                  exp = f"{d.get('expect', '')} {'' if d.get('expect_path') in ('-', 'any', None) else d['expect_path']}".strip()
                  if d.get("skipped"):
                      print(f"| {d['check']} | {exp} | skipped | | | | | | | {d.get('reason', '')} |")
                      continue
                  if "passed" not in d:
                      continue
                  keep = {k: d[k] for k in ("error", "what", "server_ready", "server_rss_kib", "client_rss_kib", "helper_rss_kib", "helper_store_bytes_after_fetch", "relay", "relay_manifests", "manifest_event_bytes", "relay_beacons", "relay_refused", "relay_refused_first", "publish_err") if k in d}
                  print(f"| {d['check']} | {exp} | {'✓' if d['passed'] else '✗'}{'' if d['judged'] else ' (info)'} | {d.get('path')} | {d.get('direct_bytes')} | {d.get('relayed_bytes')} | {d.get('nostr_bytes', '')} | {d.get('mbit_s', '')} | {d.get('wall_ms', '')} | `{json.dumps(keep)}` |")
          except FileNotFoundError:
              print("| (no NAT results) | | | | | | | | | |")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-iroh-results
          path: results/
          retention-days: 30

  verdict:
    needs: [build, matrix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: every judged check passed
        env:
          OUTCOMES: >-
            fmt=${{ needs.build.outputs.fmt }} clippy=${{ needs.build.outputs.clippy }}
            test=${{ needs.build.outputs.test }} deny=${{ needs.build.outputs.deny }}
            bare=${{ needs.matrix.outputs.bare }} nat=${{ needs.matrix.outputs.nat }}
        run: |
          echo "$OUTCOMES"
          for kv in $OUTCOMES; do [ "${kv#*=}" = success ] || { echo "not passed: $kv"; exit 1; }; done
