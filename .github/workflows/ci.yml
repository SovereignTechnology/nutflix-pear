# CI for the public nutflix-pear repo (GitHub Actions). Tests and CI never run on a developer
# machine; this is where they run. Mirrors the gates in ci/gitlab-ci.yml, which stays for a
# GitLab runner.
#
# Supply-chain policy (threat T12): actions pinned by commit SHA; `npm ci --ignore-scripts`
# (lockfile-only, exact pins, no lifecycle scripts); lockfile drift and non-registry
# resolutions fail; registry signatures and provenance verified; the native-module inventory
# is frozen; least-privilege token. The iroh helper (ADR 0021) builds with the runner's own
# rustup at the pinned toolchain, its Cargo.lock honoured (--locked), as spike-iroh.yml builds it.
#
# A weekly run on main (Monday) surfaces a new npm or RUSTSEC advisory without waiting for a push;
# it has a concurrency group of its own, so a push to main never cancels it. Every job has a
# timeout, so a hung step cannot hold a runner for Actions' 6 h default. zizmor.yml lints this file.
name: ci

on:
  push:
    branches: [main, 'stage-*/**']
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

env:
  # The reviewed inventory is a linux-x64 list and the runner is linux-x64: mismatches fail.
  NATIVE_INVENTORY_STRICT: '1'
  # Never let the runner's environment inject loaders into anything we execute here.
  NODE_OPTIONS: ''

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-contracts-version diffs against the default branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: lockfile drift
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code --stat package-lock.json
      - name: every dependency resolves to registry.npmjs.org
        run: |
          node -e '
            const p = require("./package-lock.json").packages;
            const bad = Object.entries(p).filter(([k, v]) => k.startsWith("node_modules/") && !v.link && v.resolved && !/^https:\/\/registry\.npmjs\.org\//.test(v.resolved));
            if (bad.length) { console.error("non-registry resolutions:", bad.map(([k]) => k)); process.exit(1); }'
      - name: registry signatures and provenance
        run: npm audit signatures
      - name: advisories (high and above)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: locked directories and the contracts version
        # Through env, never expanded into the script (zizmor: template-injection).
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          bash scripts/check-locked-dirs.sh
          bash scripts/check-contracts-version.sh "origin/${DEFAULT_BRANCH}"
      - run: bash scripts/native-module-inventory.sh --check
      - run: npm run lint:electron

  # Slice 5e-3 (ADR 0021): the iroh helper that the worker's iroh tests spawn for real
  # (`nfx-iroh.integration.test.ts`, which fails, never skips, in CI without it). Release build,
  # the runner's own rustup, the toolchain the crate pins, its Cargo.lock honoured. The helper's
  # own gates (fmt, clippy, tests, cargo deny, the NAT matrix) stay in spike-iroh.yml.
  iroh-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # crates/iroh-helper/rust-toolchain.toml's channel (nfx's), checked below.
      RUST_VERSION: '1.98.0'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned toolchain (the runner's rustup; no other download)
        run: |
          set -euo pipefail
          # One pin, two places: the crate's rust-toolchain.toml and RUST_VERSION may not drift.
          grep -qx "channel = \"${RUST_VERSION}\"" crates/iroh-helper/rust-toolchain.toml
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
      - name: cache (cargo registry, the helper's build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/iroh-helper/target
          key: iroh-helper-${{ env.RUST_VERSION }}-${{ hashFiles('crates/iroh-helper/Cargo.lock') }}
          restore-keys: |
            iroh-helper-${{ env.RUST_VERSION }}-
      - name: build (release, --locked)
        working-directory: crates/iroh-helper
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-helper-linux-x64
          path: crates/iroh-helper/target/release/nutflix-iroh-helper
          if-no-files-found: error
          retention-days: 7

  # RUSTSEC advisories for the iroh helper's Cargo.lock, on every run, as `verify` audits npm: the
  # weekly run is what surfaces a new one on an unchanged tree. Its own job, so an advisory never
  # skips `test` or `package`. spike-iroh.yml still runs the helper's whole `cargo deny check`.
  rust-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_VERSION: '1.98.0'
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain and cargo-deny (the download checked against its pinned sha256)
        run: |
          set -euo pipefail
          grep -qx "channel = \"${RUST_VERSION}\"" crates/iroh-helper/rust-toolchain.toml
          rustup toolchain install "$RUST_VERSION" --profile minimal
          curl -sSfLo "$RUNNER_TEMP/deny.tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
      - name: cargo deny check advisories (crates/iroh-helper)
        working-directory: crates/iroh-helper
        run: cargo deny --locked check advisories

  # The helper on the next rustc, as rbitcoin-org/rbitcoin's rust-forward job checks its own: the
  # shipped toolchain stays rust-toolchain.toml's (nfx's, by hand); this proves the code still
  # builds, warning-free, on the channel in crates/iroh-helper/rust-forward.toml before that move.
  rust-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the forward toolchain (the runner's rustup)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' crates/iroh-helper/rust-forward.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          # Over rust-toolchain.toml, for every later step.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: cargo check (all targets, --locked)
        working-directory: crates/iroh-helper
        run: |
          rustc --version
          cargo check --locked --all-targets

  test:
    needs: iroh-helper
    runs-on: ubuntu-24.04
    # 5-27 min measured (2026-11-06).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # The real-ffmpeg suites (core/media: the transcode pipeline and the NFX CMAF remux) skip
      # without a binary; Ubuntu's ffmpeg, as the e2e job installs it, so they run here.
      - name: system packages (ffmpeg for the real-ffmpeg suites)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
      # Outside the checkout, so no lint, build or test glob ever walks it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iroh-helper-linux-x64
          path: ${{ runner.temp }}/iroh-helper
      - name: the iroh helper (artifacts drop the executable bit)
        run: chmod 0755 "$RUNNER_TEMP/iroh-helper/nutflix-iroh-helper"
      # The app-desktop suites read sibling packages from dist/ and the packaging tests stage
      # the built app, so the build comes first.
      - run: npm run build
      # Only the test step sees the helper: the worker's iroh suite spawns it. With --coverage
      # (v8), the floors in vitest.config.ts gate it, as rbitcoin's coverage job gates its own.
      - run: npm test -- --coverage
        env:
          NUTFLIX_IROH_HELPER: ${{ runner.temp }}/iroh-helper/nutflix-iroh-helper
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: system packages (a virtual display, ffmpeg for the fixtures)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - run: npm ci --ignore-scripts
      # Lifecycle scripts are off, so Electron's binary is fetched explicitly.
      - run: node node_modules/electron/install.js
      # Chromium's sandbox stays on (never --no-sandbox): Ubuntu 24.04 restricts unprivileged
      # user namespaces, so use the SUID helper, as e2e/support.ts `sandboxReady` accepts.
      - name: SUID chrome-sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: xvfb-run -a npm run -w packages/app-desktop test:e2e

  package:
    needs: iroh-helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Slice 5e-5: the helper the app ships, as the release job builds it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iroh-helper-linux-x64
          path: ${{ runner.temp }}/iroh-helper
      - name: the iroh helper (artifacts drop the executable bit)
        run: chmod 0755 "$RUNNER_TEMP/iroh-helper/nutflix-iroh-helper"
      # Stages the packaged app (ADR 0017): the stale-build, bundle allow-list and layout gates
      # run here, and the iroh helper is checked to be an x64 ELF; no installer is built and
      # nothing is signed.
      - run: npm run -w packages/app-desktop stage -- --iroh-helper "$RUNNER_TEMP/iroh-helper/nutflix-iroh-helper"
