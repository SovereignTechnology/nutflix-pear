# Desktop release (ADR 0017; Cameron, 2026-10-02): Linux only for 0.1.0 (`.deb` + AppImage),
# not signed by the OS. Integrity rests on SHA256SUMS and the kind 30071 notice that Cameron
# signs with the SovTech key (through Bunker46), outside this workflow. Ported from the
# inactive packages/app-desktop/packaging/ci/release.gitlab-ci.yml, which keeps the Windows and
# macOS jobs for later.
#
#   push a `desktop-v<version>` tag   build, manifest, then a DRAFT GitHub release (not public:
#                                      Cameron publishes it once the notice is signed)
#   a PR that touches the packaging    the same build and manifest, no release (a dry run)
#
# No job holds a key or signs anything. Only `draft-release` can write (contents: write), only
# on a tag, and it runs no project code: it attaches files the read-only jobs made.
name: release

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'crates/iroh-helper/**'
      - 'packages/app-desktop/packaging/**'
      - 'packages/app-desktop/package.json'
      - 'scripts/release-manifest.mjs'

permissions:
  contents: read

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # crates/iroh-helper/rust-toolchain.toml's channel, as ci.yml's iroh-helper job (checked).
      RUST_VERSION: '1.98.0'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # A tag must name exactly the version being built: every artifact name carries it.
      - name: the tag names this version
        if: github.event_name == 'push'
        run: |
          v="$(node -p "require('./packages/app-desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "desktop-v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name @sovit/app-desktop $v"
            exit 1
          fi
      # Slice 5e-5 (ADR 0021): the iroh helper the app ships, built here from this commit with
      # the pinned toolchain and its Cargo.lock (never a cache: a release builds clean), and
      # staged by `make --iroh-helper`, which checks it is an x64 ELF.
      - name: the iroh helper (pinned toolchain, release, --locked)
        run: |
          set -euo pipefail
          grep -qx "channel = \"${RUST_VERSION}\"" crates/iroh-helper/rust-toolchain.toml
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cd crates/iroh-helper
          cargo build --release --locked
          sha256sum target/release/nutflix-iroh-helper
      - name: system packages (dpkg's fakeroot, mksquashfs for the AppImage)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot squashfs-tools
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Not an npm package: the pinned dated release. Checked here for a clear error; the maker
      # (packaging/maker-appimage.ts) refuses any other bytes as well.
      - name: the pinned AppImage runtime
        run: |
          mkdir -p packages/app-desktop/out/appimage-runtime
          curl -fsSLo packages/app-desktop/out/appimage-runtime/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  packages/app-desktop/out/appimage-runtime/runtime-x86_64' \
            | sha256sum -c -
      # Fixed timestamps (the .deb and the squashfs) from the commit. The release event's
      # created_at does not come from here: it is when the manifest is made.
      - name: make (.deb, AppImage)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          npm run -w packages/app-desktop make -- --platform linux --arch x64 --targets deb,appimage \
            --iroh-helper "$GITHUB_WORKSPACE/crates/iroh-helper/target/release/nutflix-iroh-helper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-x64
          path: packages/app-desktop/out/make/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  # ONE manifest and ONE unsigned event for the whole release (kind 30071 is addressable: relays
  # keep one per key + kind + d), from the lists the platform jobs wrote.
  desktop-release-manifest:
    needs: [desktop-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-x64
          path: packages/app-desktop/out/make/
      - name: SHA256SUMS, release-manifest.json, the unsigned event
        run: >-
          node scripts/release-manifest.mjs
          --made packages/app-desktop/out/make/linux-x64.artifacts.json
          --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: |
            packages/app-desktop/out/make/deb/x64/*.deb
            packages/app-desktop/out/make/appimage/x64/*.AppImage
            packages/app-desktop/out/release/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  draft-release:
    if: github.event_name == 'push'
    needs: [desktop-release-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/app-desktop/packaging/ci/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: release-files/
      # A draft is not public. A re-run fails if the draft exists already: delete it first.
      - name: draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          sed "s/<version>/$v/g" packages/app-desktop/packaging/ci/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Nutflix desktop $v" --notes-file notes.md \
            release-files/make/deb/x64/*.deb \
            release-files/make/appimage/x64/*.AppImage \
            release-files/release/SHA256SUMS \
            release-files/release/release-manifest.json \
            release-files/release/release-event.unsigned.json
