# The iroh helper's WebRTC side (ADR 0023, #89) against a real browser: headless Chromium (its
# sandbox on) running nfx's web player library, the tar packages/app-web/nfx-web.lock pins, with
# nfxd built from the same nfx commit. crates/iroh-helper/e2e/browser.e2e.ts has the two cases:
#   seed   the helper serves a rendition from nfxd's store and answers the browser's offers; the
#          browser's origin refuses every segment once playback has started, and playback must go
#          on, nothing rejected (so the bytes came from the helper);
#   fetch  the helper offers to the same browser and fetches every segment it announces, each
#          one's sha256 the one its playlist names.
# Signaling goes through nfxd's embedded tracker, the only signaling today's player speaks; the
# tracker client is the test's own and never ships (ADR 0023 §3). nfxd runs without --bridge, so
# the helper is the only native WebRTC peer. Everything runs on 127.0.0.1 with throwaway keys and
# a generated clip: nothing here is a server for anyone but the run's own browser.
#
# Supply-chain policy as ci.yml (threat T12): actions pinned by commit SHA, `npm ci
# --ignore-scripts`, Cargo.lock honoured (--locked), least-privilege token, no secrets. Downloads:
# nfx's source archive (sha256 from the lock), wasm-pack and wasm-bindgen (sha256 from the lock),
# the runner's rustup toolchain, ffmpeg (apt), and Playwright's Chromium (`playwright-core
# install`, the version the lockfile pins). Not a required check.
name: helper-webrtc

on:
  pull_request:
    paths:
      - 'crates/iroh-helper/**'
      - 'packages/app-web/nfx-web.lock'
      - '.github/workflows/helper-webrtc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-webrtc-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: ''
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the lock's pins
        id: lock
        run: bash packages/app-web/scripts/nfx-lib.sh show | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: the lock's Rust toolchain and the wasm32 target (the runner's rustup)
        env:
          RUST_VERSION: ${{ steps.lock.outputs.RUST_VERSION }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc -V
      - name: wasm-pack and wasm-bindgen (the lock's releases, sha256-checked)
        env:
          WASM_PACK_VERSION: ${{ steps.lock.outputs.WASM_PACK_VERSION }}
          WASM_PACK_SHA256: ${{ steps.lock.outputs.WASM_PACK_SHA256 }}
          WASM_BINDGEN_VERSION: ${{ steps.lock.outputs.WASM_BINDGEN_VERSION }}
          WASM_BINDGEN_SHA256: ${{ steps.lock.outputs.WASM_BINDGEN_SHA256 }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tools"
          mkdir -p "$d"
          curl -sSfL --retry 8 --retry-all-errors -o "$d/wasm-pack.tgz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  $d/wasm-pack.tgz" | sha256sum -c -
          curl -sSfL --retry 8 --retry-all-errors -o "$d/wasm-bindgen.tgz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $d/wasm-bindgen.tgz" | sha256sum -c -
          tar -xzf "$d/wasm-pack.tgz" -C "$d"
          tar -xzf "$d/wasm-bindgen.tgz" -C "$d"
          sudo install -m 0755 "$d/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/
          sudo install -m 0755 "$d/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - name: the player library from the pinned source (refused unless its tar is the lock's)
        run: |
          set -euo pipefail
          bash packages/app-web/scripts/nfx-lib.sh build --out "$RUNNER_TEMP/nfx-lib"
          tar="$(ls "$RUNNER_TEMP"/nfx-lib/nfx-web-lib-*.tar)"
          bash packages/app-web/scripts/nfx-lib.sh check "$tar"
          mkdir -p "$RUNNER_TEMP/lib"
          tar -xf "$tar" -C "$RUNNER_TEMP/lib" --no-same-owner
          ls -lR "$RUNNER_TEMP/lib"
      - name: nfx's source at the lock's commit (the archive, sha256-checked as nfx-lib.sh checks it)
        env:
          NFX_COMMIT: ${{ steps.lock.outputs.NFX_COMMIT }}
          NFX_SRC_SHA256: ${{ steps.lock.outputs.NFX_SRC_SHA256 }}
        run: |
          set -euo pipefail
          [[ $NFX_COMMIT =~ ^[0-9a-f]{40}$ && $NFX_SRC_SHA256 =~ ^[0-9a-f]{64}$ ]]
          curl -sSfL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/nfx.tar.gz" \
            "https://github.com/SovereignTechnology/nfx/archive/${NFX_COMMIT}.tar.gz"
          echo "${NFX_SRC_SHA256}  $RUNNER_TEMP/nfx.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfx"
          tar -xzf "$RUNNER_TEMP/nfx.tar.gz" -C "$RUNNER_TEMP/nfx" --strip-components=1 --no-same-owner
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/nfx/crates/target
            crates/iroh-helper/target
          key: helper-webrtc-${{ steps.lock.outputs.RUST_VERSION }}-${{ steps.lock.outputs.NFX_COMMIT }}-${{ hashFiles('crates/iroh-helper/Cargo.lock') }}
          restore-keys: |
            helper-webrtc-${{ steps.lock.outputs.RUST_VERSION }}-${{ steps.lock.outputs.NFX_COMMIT }}-
      - name: nfxd and nfx-package (debug builds, as nfx's own e2e uses them)
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path "$RUNNER_TEMP/nfx/crates/Cargo.toml" -p nfxd -p nfx-media --bins
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/nfx/crates/target/debug/nfxd" "$RUNNER_TEMP/nfx/crates/target/debug/nfx-package" "$RUNNER_TEMP/bin/"
      - name: the iroh helper (this checkout, --locked)
        working-directory: crates/iroh-helper
        run: |
          set -euo pipefail
          cargo build --locked
          install -m 0755 target/debug/nutflix-iroh-helper "$RUNNER_TEMP/bin/"
      - name: ffmpeg (the clip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: playwright-core and its Chromium
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright-core install --with-deps chromium
      # Chromium's sandbox stays on (the run never passes --no-sandbox): Ubuntu 24.04 restricts the
      # unprivileged user namespaces it uses, so lift that on this throwaway runner, as
      # screenshots.yml does.
      - name: allow Chrome's user-namespace sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the browser run (crates/iroh-helper/e2e/browser.e2e.ts)
        env:
          NUTFLIX_IROH_HELPER: ${{ runner.temp }}/bin/nutflix-iroh-helper
          NFX_BIN: ${{ runner.temp }}/bin
          NFX_LIB: ${{ runner.temp }}/lib
          E2E_OUT: ${{ runner.temp }}/e2e-out
        run: timeout --kill-after=30 1800 node crates/iroh-helper/e2e/browser.e2e.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: helper-webrtc
          path: ${{ runner.temp }}/e2e-out/
          if-no-files-found: ignore
          retention-days: 14
