# The fuzz campaign (execution plan §4; Cameron, 2026-10-02): fast-check, long runs, started by
# hand — never on a push or a PR. Each shard runs every target in
# packages/core/src/fuzz/__tests__/ for the chosen time with its own seeds; a finding fails its
# shard and prints the seed and path that replay it (`fc.assert(prop, { seed, path })`).
# Defaults: 4 shards × 6 h (Actions' job limit) = 24 CPU-hours.
#
# Same supply-chain policy as ci.yml: actions pinned by commit SHA, `npm ci --ignore-scripts`,
# read-only token, no third-party actions (findings go to the job log).
name: fuzz

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes each target runs per shard (max 340: a job may run 6 h)'
        required: true
        default: '340'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: ''

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: fuzz (shard ${{ matrix.shard }})
        env:
          FUZZ_SHARD: ${{ matrix.shard }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a whole number"; exit 1 ;; esac
          if [ "$MINUTES" -gt 340 ] || [ "$MINUTES" -lt 1 ]; then echo "minutes must be 1..340"; exit 1; fi
          # Each target file runs in its own worker, all at once; within a file the targets share the
          # time (`fuzz.mts`), so a shard ends after about MINUTES.
          FUZZ_SECONDS=$((MINUTES * 60)) npx vitest run --project core packages/core/src/fuzz \
            --reporter=verbose --silent=false
