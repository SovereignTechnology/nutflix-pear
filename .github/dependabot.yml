# Dependabot version updates (docs.github.com/code-security/dependabot), in the shape of
# rbitcoin-org/rbitcoin's: weekly on Monday, patch and minor bumps grouped, every major its own
# PR. The cooldown is 7 days (rbitcoin keeps 3; zizmor's dependabot-cooldown audit asks for 7):
# a release is a week old before it is proposed, so a hijacked publish has time to be caught and
# yanked. Security updates do not wait for it.
#
# Ecosystems in this tree:
#   npm             package.json / package-lock.json at the root (the workspaces)
#   cargo           crates/iroh-helper (its own Cargo.lock; the toolchain stays nfx's, by hand)
#   github-actions  .github/workflows/*
#   pip             .github/zizmor.requirements.txt (the zizmor pin, with its hash)
#
# Every proposal meets CI's gates like any PR (threat T12): the lockfile-drift, registry,
# signature and advisory checks, the frozen native-module inventory, and the iroh helper's
# cargo deny. A bump that adds a native module or a non-registry source fails `verify` by design.
# Merges are local squashes as sovtech, never on GitHub's side.
# spikes/ and docs/vendor/ are left out: nothing ships from them.

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps(npm)'
    groups:
      npm-patch:
        update-types:
          - 'patch'
      npm-minor:
        update-types:
          - 'minor'
    # Held on evidence (2026-11-18, the #115/#116 rebuild). Lift each when its reason is gone.
    ignore:
      # The Bare the desktop app ships is pear-runtime 1.3.1's: v1.31.0 (sidecar.test.ts pins it).
      # bare-sidecar 0.5.15 bundles Bare 1.36, so the tests would run a runtime the app does not.
      - dependency-name: 'bare-sidecar'
        versions:
          - '> 0.5.4'
      # 6.2.x moves bare-structured-clone to 2.x, which loads bare-type (engine bare >= 1.32): the
      # worker dies at start under Bare 1.31 (UNSUPPORTED_ENGINE).
      - dependency-name: 'bare-subprocess'
        versions:
          - '> 6.1.0'
      # TypeScript 7 (the native port) is outside typescript-eslint's peer range, `>=4.8.4 <6.1.0` on
      # 8.72.2 and on the latest 8.73.0, and the lint here is type-aware through the compiler API.
      # Lift when typescript-eslint supports 7. Minor and patch of 6.x still flow.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # jsdom 30 requires Node ^22.22.2 and .npmrc sets engine-strict, so every dev and CI image on an
      # older 22.x (the repo's floor is 22.12) would refuse `npm ci`. Raising that floor is a decision
      # for the maintainer, with the images that must follow; lift this when it is made.
      - dependency-name: 'jsdom'
        versions:
          - '>= 30.0.0'
      # nostr-tools pins @scure/bip39 2.0.1 exactly, so a newer copy in core/app-desktop is a second,
      # nested one (packages/*/node_modules/@scure/bip39) that the packaged-app staging
      # (stage.test.ts, prompt-npm.test.ts) does not expect. Lift when nostr-tools' pin moves.
      - dependency-name: '@scure/bip39'
        versions:
          - '> 2.0.1'
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: 'cargo'
    directory: '/crates/iroh-helper'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(cargo)'
    groups:
      cargo-patch:
        update-types:
          - 'patch'
      cargo-minor:
        update-types:
          - 'minor'
    # iroh-blobs is a wire pin, not a convenience bump: NFX-11 §4 fixes it at 0.103.x (the
    # `BlobTicket` layout in NFX-06 §2) and says a bump of any of the three iroh crates is an NFX-11
    # edit first, in nfx. 0.104.0 passed this repo's interop jobs (#66, 2026-11-18) against nfxd at
    # 0.103.1, but that is not the spec moving. Lift this when nfx's NFX-11 §4 and lock move.
    ignore:
      - dependency-name: 'iroh-blobs'
        versions:
          - '>= 0.104.0'
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(actions)'
    groups:
      actions:
        patterns:
          - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pip'
    directory: '/.github'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'deps(zizmor)'
    cooldown:
      default-days: 7
