# Dependabot version updates (docs.github.com/code-security/dependabot), in the shape of
# rbitcoin-org/rbitcoin's: weekly on Monday, patch and minor bumps grouped, every major its own
# PR. The cooldown is 7 days (rbitcoin keeps 3; zizmor's dependabot-cooldown audit asks for 7):
# a release is a week old before it is proposed, so a hijacked publish has time to be caught and
# yanked. Security updates do not wait for it.
#
# Ecosystems in this tree:
#   npm             package.json / package-lock.json at the root (the workspaces)
#   cargo           crates/iroh-helper (its own Cargo.lock; the toolchain stays nfx's, by hand)
#   github-actions  .github/workflows/*
#   pip             .github/zizmor.requirements.txt (the zizmor pin, with its hash)
#
# Every proposal meets CI's gates like any PR (threat T12): the lockfile-drift, registry,
# signature and advisory checks, the frozen native-module inventory, and the iroh helper's
# cargo deny. A bump that adds a native module or a non-registry source fails `verify` by design.
# Merges are local squashes as sovtech, never on GitHub's side.
# spikes/ and docs/vendor/ are left out: nothing ships from them.

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps(npm)'
    groups:
      npm-patch:
        update-types:
          - 'patch'
      npm-minor:
        update-types:
          - 'minor'
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: 'cargo'
    directory: '/crates/iroh-helper'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(cargo)'
    groups:
      cargo-patch:
        update-types:
          - 'patch'
      cargo-minor:
        update-types:
          - 'minor'
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(actions)'
    groups:
      actions:
        patterns:
          - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pip'
    directory: '/.github'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'deps(zizmor)'
    cooldown:
      default-days: 7
