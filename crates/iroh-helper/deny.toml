# cargo-deny policy for the iroh helper (ADR 0021). Run in CI only: cargo deny check, from
# crates/iroh-helper/. Adapted from nfx's crates/deny.toml (nfx main 29019d2), keeping the rows
# iroh and iroh-blobs need; the WebRTC (str0m) row stays nfx's, as nothing here uses it.

[graph]
# The targets the helper is meant to ship for (ADR 0103 §3 step 2); the spike builds linux-x64.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice) fails the check unless
# it is listed here with a reason.
yanked = "deny"
ignore = [
    # "Unmaintained" notices, not vulnerabilities: compile-time proc macros deep in iroh's tree,
    # the same two nfx ignores. Revisit at every iroh bump.
    { id = "RUSTSEC-2024-0436", reason = "paste (proc macro) via iroh > netwatch > netdev > netlink-packet-core; unmaintained notice only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (proc macro) via iroh-blobs > bao-tree > genawaiter; unmaintained notice only" },
]

[licenses]
# Permissive licences only for dependencies; this crate is AGPL-3.0-or-later and unpublished.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs (Mozilla root CA data), via iroh
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Copyleft stays out of the global list: each MPL crate is named. MPL-2.0 is file-level and
# compatible with this repository's AGPL-3.0-or-later.
exceptions = [
    { allow = ["MPL-2.0"], crate = "attohttpc" }, # via iroh > portmapper > igd-next (UPnP)
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
