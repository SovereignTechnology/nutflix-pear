# The thin iroh helper the desktop worker spawns (ADR 0021; nfx ADR 0103). Its own workspace:
# nothing in the npm workspaces depends on it, and it depends on nothing of ours.
[workspace]

[package]
name = "nutflix-iroh-helper"
version = "0.0.1"
description = "Moves bytes over iroh and iroh-blobs for the nutflix-pear worker; decides nothing"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SovereignTechnology/nutflix-pear"
publish = false

[dependencies]
# The series NFX-11 §4 pins, at the versions nfx's own lock builds (nfx main 29019d2).
iroh = "1.2.0"
iroh-blobs = "0.103.1"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# As nfx's release profile: a wrapped count panics instead of passing silently.
overflow-checks = true

# Measured beside `release` (spike S-D): the size a shipped helper would have at opt-level "s".
[profile.release-small]
inherits = "release"
opt-level = "s"
