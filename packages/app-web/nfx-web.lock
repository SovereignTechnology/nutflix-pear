# packages/app-web/nfx-web.lock: the nfx web player library this site is built with (ADR 0022 item 2).
#
# The pin is the one `nfx` line:
#
#   nfx <commit> <source sha256> <library tar sha256>
#
#   commit          SovereignTechnology/nfx, 40 lowercase hex
#   source sha256   of GitHub's archive of that commit,
#                   https://github.com/SovereignTechnology/nfx/archive/<commit>.tar.gz
#   library sha256  of nfx-web-lib-<commit, 12 hex>.tar, which nfx's web/player/lib-tar.sh builds
#                   from that source: api.d.ts, player.d.ts, player.js, wasm/nfx_wasm_bg.wasm
#
# Re-pinning is replacing that line, and nothing else: `bash scripts/nfx-lib.sh pin <commit>` (from
# packages/app-web, with the tools below on PATH) fetches the source, builds the tar and prints the
# new line. The site build (scripts/build-site.ts) refuses a tar whose sha256 is not the one here,
# and checks the tar's api.d.ts and player.d.ts against src/nfx-lib.ts, so a library whose API
# drifted fails the build. The e2e (e2e/web.e2e.ts) runs nfxd built from the same commit.
#
# How to rebuild the tar: `bash scripts/nfx-lib.sh build` (from packages/app-web). It downloads the
# source, refuses it unless its sha256 is the one here, runs `npm ci --ignore-scripts` and lib-tar.sh
# in it, and refuses the tar unless its sha256 is the one here. lib-tar.sh checks the tools first,
# because other versions give other bytes:
#
#   tool <name> <version> [<sha256 of the x86_64-unknown-linux-musl release tarball>]
#
# rust: the toolchain with the wasm32-unknown-unknown target (nfx's rust-version and its CI image).
# wasm-pack and wasm-bindgen: GitHub releases, wasm-bindgen at the version nfx's crates/Cargo.lock
# pins (on PATH, so wasm-pack downloads nothing). esbuild and typescript come from
# web/player/package-lock.json. Node 22.
#
# 491d35e is nfx v0.1.2's release commit (#92), the nfxd booty and the public testnet seeder run.
# Since b5fe5e4 the library changed, and so did its tar (23a551e8…; GitHub's runner and a Kata VM
# give the same bytes):
#   #85 (#87)  `open()` asks each origin which renditions it holds (its media playlists and init
#              segments, 64 KiB each, 8 s per origin); an `OriginSource`'s `renditions`, and a
#              beacon's claims, are hints only, so a stranger's beacon can no longer keep an origin
#              out of play.
#   #34        hls.js 1.7.4 (from 1.7.3).
# nfxd at this commit also has `--mesh-public` (#86), and the rustix 1.1.6 fix (#88).
#
# b5fe5e4 is nfx #81's merge (pear #89). Since the last pin (6c20bef, #83) the library's source did
# not change, and its tar is the same, e43bc98a…: the pin moves for nfxd, which the web-site
# workflow builds from this commit for the end-to-end run and which now has its mesh endpoint
# (`--mesh-relay`, nfx #71: a native WebRTC peer signaled over Nostr, NFX-10 §6). The site signals
# over Nostr since this pin, and speaks to no tracker.
#
# 6c20bef was nfx #83's merge. Since the pin before it (6465cb5, #74: nfxd --stun and the `stun`
# beacon endpoint):
#   #75, #80  signaling over Nostr (NFX-10 §6) is available: `open()` takes
#             `signaling: { kind: 'nostr', relays }`. This site uses it since pear #89.
#   #76, #77  nfx-package makes one rendition by default, and nfxd may hold only some
#             (`--seed <a>#360p`, the beacon's `https` endpoint naming its `renditions`).
#   #83       held renditions: `open()` takes `renditions` (the allowed ids, preferred first) and
#             origins with the renditions each serves (`OriginSource`), offers only the levels the
#             origin it plays from serves, and each level carries its rendition id (`Level.id`).
# From #74 on, lib-tar.sh writes the ustar itself (web/player/lib-tar.mjs) instead of calling GNU
# tar, whose bytes differ between 1.34 and 1.35: GitHub's ubuntu-24.04 runner and a Kata VM give the
# same tar, e43bc98a…. The web-site workflow (.github/workflows/web-site.yml) builds it again on
# every run and fails unless it matches.
